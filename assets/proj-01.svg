<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="BankerGuard-OS: Operating Systems project implementing the Banker's Algorithm for deadlock avoidance. Open repository.">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#142b42"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#112336"/><stop offset="1" stop-color="#0d1b2a"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#cfe9ee" stop-opacity=".30"/><stop offset="1" stop-color="#a8dadc" stop-opacity="0"/></radialGradient>
<linearGradient id="shim" x1="0" x2="1"><stop offset="0" stop-color="#a8dadc" stop-opacity="0"/><stop offset=".5" stop-color="#e6f0f5"/><stop offset="1" stop-color="#a8dadc" stop-opacity="0"/></linearGradient>
<linearGradient id="lnR" x1="0" x2="1"><stop offset="0" stop-color="#6c8ead"/><stop offset="1" stop-color="#6c8ead" stop-opacity="0"/></linearGradient>
<linearGradient id="lnL" x1="0" x2="1"><stop offset="0" stop-color="#6c8ead" stop-opacity="0"/><stop offset="1" stop-color="#6c8ead"/></linearGradient>
<filter id="fog" x="-20%" y="-150%" width="140%" height="400%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><rect width="400" height="240" rx="16"/></clipPath></defs><style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.cjk{font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','MS Mincho',serif}
.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes d1{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
@keyframes d2{0%,100%{transform:translateX(60px)}50%{transform:translateX(-60px)}}
.f1{animation:d1 22s ease-in-out infinite}.f2{animation:d2 26s ease-in-out infinite}.f3{animation:d1 30s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes sweep{0%{transform:translateX(-260px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1460px);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sh{animation:sweep 6s ease-in-out infinite;animation-delay:0.0s}
.arrow{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.needle{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.nd{animation:pulse 2.4s ease-in-out infinite}.gp{animation:pulse 3s ease-in-out infinite}
.steam{animation:steam 3s ease-in-out infinite}@keyframes steam{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-3px);opacity:.9}}
.fl{animation:fadeup .7s ease-out both}</style>
