@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.c1{animation:fadeup .8s ease-out .2s both}.c2{animation:fadeup .8s ease-out .5s both}.c3{animation:fadeup .8s ease-out .8s both}
@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-28}}.flow{animation:flow 1.1s linear infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
.lock{animation:pulse 2.6s ease-in-out infinite}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes bar{0%{transform:translateX(-120px)}100%{transform:translateX(320px)}}
.bar{animation:bar 2.8s ease-in-out infinite}
