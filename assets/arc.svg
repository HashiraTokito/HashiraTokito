.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes d1{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
@keyframes d2{0%,100%{transform:translateX(60px)}50%{transform:translateX(-60px)}}
.f1{animation:d1 22s ease-in-out infinite}.f2{animation:d2 26s ease-in-out infinite}.f3{animation:d1 30s ease-in-out infinite}
