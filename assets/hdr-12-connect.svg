<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 76" width="1200" height="76" role="img" aria-label="12. Connect">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#142b42"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#112336"/><stop offset="1" stop-color="#0d1b2a"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#cfe9ee" stop-opacity=".30"/><stop offset="1" stop-color="#a8dadc" stop-opacity="0"/></radialGradient>
<linearGradient id="shim" x1="0" x2="1"><stop offset="0" stop-color="#a8dadc" stop-opacity="0"/><stop offset=".5" stop-color="#e6f0f5"/><stop offset="1" stop-color="#a8dadc" stop-opacity="0"/></linearGradient>
<linearGradient id="lnR" x1="0" x2="1"><stop offset="0" stop-color="#6c8ead"/><stop offset="1" stop-color="#6c8ead" stop-opacity="0"/></linearGradient>
<linearGradient id="lnL" x1="0" x2="1"><stop offset="0" stop-color="#6c8ead" stop-opacity="0"/><stop offset="1" stop-color="#6c8ead"/></linearGradient>
<filter id="fog" x="-20%" y="-150%" width="140%" height="400%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip2"><rect x="281" y="0" width="859" height="76"/></clipPath><clipPath id="clip"><rect width="1200" height="76" rx="16"/></clipPath></defs><style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.cjk{font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','MS Mincho',serif}
.tw{animation:tw 5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes d1{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
@keyframes d2{0%,100%{transform:translateX(60px)}50%{transform:translateX(-60px)}}
.f1{animation:d1 22s ease-in-out infinite}.f2{animation:d2 26s ease-in-out infinite}.f3{animation:d1 30s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes sweep{0%{transform:translateX(-260px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1460px);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hd{animation:fadeup .7s ease-out both}
.rl{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out .2s both}
.swp{animation:sweep 7s ease-in-out infinite}</style>
<rect x=".5" y=".5" width="1199" height="75" rx="12" fill="#0d1b2a" stroke="#22384d"/><g class="hd"><text class="mono" x="26" y="57" font-size="46" font-weight="700" fill="none" stroke="#a8dadc" stroke-width="1.2" opacity=".9">12</text><text class="sans" x="96" y="38" font-size="26" font-weight="600" letter-spacing="6" fill="#e6f0f5">CONNECT</text><text class="mono" x="97" y="61" font-size="11" letter-spacing="4" fill="#6c8ead">REACH THE HASHIRA</text></g><g class="rl"><rect x="281" y="33.5" width="859" height="1.2" fill="url(#lnR)"/></g><g clip-path="url(#clip2)"><rect class="swp" x="0" y="32.8" width="220" height="2.6" rx="1" fill="url(#shim)"/></g><path d="M1160 25 L1169 34 L1160 43 L1151 34 Z" fill="#0d1b2a" stroke="#a8dadc" stroke-width="1.3" class="fb" style="animation:pulse 4s ease-in-out infinite"/><circle cx="1160" cy="34" r="2" fill="#a8dadc"/></svg>
