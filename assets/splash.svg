<circle class="sp" cx="91" cy="259" r="2.2" fill="#d7f3ea" style="animation-delay:-1.2s"/><circle class="sp" cx="602" cy="242" r="1.7" fill="#d7f3ea" style="animation-delay:-1.3s"/><circle class="sp" cx="779" cy="279" r="1.4" fill="#d7f3ea" style="animation-delay:-4.5s"/><circle class="sp" cx="149" cy="255" r="1.7" fill="#d7f3ea" style="animation-delay:-1.5s"/><circle class="sp" cx="306" cy="285" r="2.4" fill="#d7f3ea" style="animation-delay:-5.6s"/><circle class="sp" cx="341" cy="286" r="1.2" fill="#d7f3ea" style="animation-delay:-1.3s"/><circle class="sp" cx="646" cy="271" r="1.9" fill="#d7f3ea" style="animation-delay:-0.3s"/><circle class="sp" cx="179" cy="243" r="1.7" fill="#d7f3ea" style="animation-delay:-0.1s"/><circle class="sp" cx="654" cy="251" r="2.2" fill="#d7f3ea" style="animation-delay:-2.7s"/><circle class="sp" cx="106" cy="235" r="1.5" fill="#d7f3ea" style="animation-delay:-4.5s"/><circle class="sp" cx="45" cy="268" r="1.6" fill="#d7f3ea" style="animation-delay:-4.4s"/><circle class="sp" cx="160" cy="267" r="1.8" fill="#d7f3ea" style="animation-delay:-4.0s"/><circle class="sp" cx="425" cy="241" r="2.0" fill="#d7f3ea" style="animation-delay:-2.2s"/><circle class="sp" cx="263" cy="282" r="1.9" fill="#d7f3ea" style="animation-delay:-5.1s"/>
<path class="cut" d="M120 262 L780 40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
<rect class="flash" width="900" height="300" fill="#d7f3ea"/>
<text class="kj kanji fb" x="450" y="205" font-size="170" text-anchor="middle" fill="#9fe3c8">霞</text>
<text class="name" x="450" y="168" font-size="44" font-weight="700" letter-spacing="9" text-anchor="middle" fill="url(#nameg)">ANIKHA PADALA</text>
<text class="tag" x="450" y="206" font-size="14" letter-spacing="4" text-anchor="middle" fill="#9fe3c8">MIST BREATHING · FULL-STACK · AI · IoT</text>
<text class="tag" x="450" y="232" font-size="12" letter-spacing="3" text-anchor="middle" fill="#8aa9a3">B.TECH CSE · KLH · @hashiratokito</text>
