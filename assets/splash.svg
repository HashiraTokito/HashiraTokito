<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1200 360">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#0d1b2a"/>
<stop offset="100%" stop-color="#142b42"/>

</linearGradient>

<filter id="mist">
<feGaussianBlur stdDeviation="12"/>
</filter>

</defs>

<rect
width="1200"
height="360"
