<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mist Breathing splash intro: Anikha Padala" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1214"/><stop offset="1" stop-color="#17332f"/></linearGradient>
<radialGradient id="moon"><stop offset="0" stop-color="#f1fff9" stop-opacity=".95"/><stop offset=".45" stop-color="#bff0dc" stop-opacity=".35"/><stop offset="1" stop-color="#9fe3c8" stop-opacity="0"/></radialGradient>
<linearGradient id="nameg" x1="0" x2="1"><stop offset="0" stop-color="#d7f3ea"/><stop offset=".5" stop-color="#9fe3c8"/><stop offset="1" stop-color="#d7f3ea"/></linearGradient>
<filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="900" height="300" rx="16"/></clipPath>
</defs>
<style>
text{font-family:'Courier New',monospace}
.kanji{font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','MS Mincho',serif}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes drift{0%{transform:translateX(-70px)}50%{transform:translateX(70px)}100%{transform:translateX(-70px)}}
@keyframes drift2{0%{transform:translateX(60px)}50%{transform:translateX(-60px)}100%{transform:translateX(60px)}}
.m1{animation:drift 16s ease-in-out infinite}
.m2{animation:drift2 20s ease-in-out infinite}
.m3{animation:drift 24s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.moon{animation:pulse 6s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-110px);opacity:0}}
.sp{animation:float 7s ease-in infinite}
@keyframes curtain{0%{opacity:1}100%{opacity:0}}
.curtain{animation:curtain 1s ease-out forwards}
@keyframes cut{0%{stroke-dashoffset:760;opacity:0}8%{opacity:1}55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.cut{stroke-dasharray:760;stroke-dashoffset:760;opacity:0;animation:cut 1.1s cubic-bezier(.2,.8,.2,1) .5s forwards}
@keyframes flash{0%{opacity:0}30%{opacity:.45}100%{opacity:0}}
.flash{opacity:0;animation:flash .6s ease-out 1s forwards}
@keyframes kanji{0%{opacity:0;transform:scale(1.2)}25%{opacity:1;transform:scale(1)}65%{opacity:1;transform:scale(1)}100%{opacity:.1;transform:scale(1)}}
.kj{opacity:0;animation:kanji 2.1s ease-out .9s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.name{opacity:0;animation:rise .9s ease-out 1.8s forwards}
.tag{opacity:0;animation:rise .7s ease-out 2.3s forwards}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="300" fill="url(#bg)"/>
<circle class="moon" cx="760" cy="85" r="70" fill="url(#moon)"/>
<circle cx="760" cy="85" r="26" fill="#eafff7" opacity=".9"/>
<ellipse class="m1" cx="250" cy="225" rx="320" ry="38" fill="#bfeede" opacity=".22" filter="url(#blur)"/>
<ellipse class="m2" cx="660" cy="195" rx="290" ry="32" fill="#9fe3c8" opacity=".18" filter="url(#blur)"/>
<ellipse class="m3" cx="450" cy="268" rx="440" ry="36" fill="#d7f3ea" opacity=".2" filter="url(#blur)"/>
