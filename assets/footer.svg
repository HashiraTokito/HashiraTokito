<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250">

<defs>

<filter id="blur">
<feGaussianBlur stdDeviation="15"/>
</filter>

</defs>

<rect width="100%" height="100%" fill="#0d1b2a"/>

<ellipse
cx="250"
cy="140"
rx="200"
ry="30"
fill="#a8dadc"
opacity="0.15"
filter="url(#blur)">

<animate
attributeName="cx"
values="250;420;250"
dur="14s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="1000"
cy="120"
rx="260"
ry="40"
fill="#e6f0f5"
opacity="0.10"
filter="url(#blur)">

<animate
attributeName="cx"
values="1000;850;1000"
dur="20s"
repeatCount="indefinite"/>

</ellipse>

<text
x="50%"
y="55%"
font-size="28"
fill="#a8dadc"
text-anchor="middle"
font-family="Segoe UI">

Lost In The Mist, Found In The Code

</text>

</svg>
