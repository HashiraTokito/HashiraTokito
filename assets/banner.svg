@keyframes rise{from{transform:translateY(46px);opacity:0}to{transform:translateY(0);opacity:1}}
.r1{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .15s both}.r2{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .30s both}
.r3{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .45s both}.r4{animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .60s both}
.moon{animation:fadein 1.4s ease-out .5s both}
.t1{animation:fadeup .8s ease-out 1.0s both}.t2{animation:fadeup .8s ease-out 1.3s both}.t3{animation:fadeup .8s ease-out 1.7s both}
.t4{animation:fadeup .8s ease-out 2.0s both}.t5{animation:fadeup .8s ease-out 2.2s both}.t6{animation:fadeup .8s ease-out 2.2s both}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}.rule{stroke-dasharray:60;animation:draw .9s ease-out .9s both}
</style>
