<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Thanks for stopping by. The mist clears for those who keep building." xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1517"/><stop offset="1" stop-color="#17332f"/></linearGradient>
<radialGradient id="moon"><stop offset="0" stop-color="#f1fff9" stop-opacity=".9"/><stop offset=".5" stop-color="#bff0dc" stop-opacity=".3"/><stop offset="1" stop-color="#9fe3c8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="900" height="190" rx="14"/></clipPath>
</defs>
<style>
text{font-family:'Courier New',monospace}
.kanji{font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','MS Mincho',serif}
@keyframes drift{0%{transform:translateX(-70px)}50%{transform:translateX(70px)}100%{transform:translateX(-70px)}}
@keyframes drift2{0%{transform:translateX(60px)}50%{transform:translateX(-60px)}100%{transform:translateX(60px)}}
.m1{animation:drift 15s ease-in-out infinite}
.m2{animation:drift2 19s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.moon{animation:pulse 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.05}50%{opacity:.14}}
.kj{animation:breathe 6s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-100px);opacity:0}}
.sp{animation:float 7s ease-in infinite}
@keyframes cutloop{0%,8%{stroke-dashoffset:900;opacity:0}12%{opacity:1}22%{stroke-dashoffset:0;opacity:1}30%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.cl{stroke-dasharray:900;stroke-dashoffset:900;opacity:0;animation:cutloop 9s ease-out infinite}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="190" fill="url(#bg)"/>
<circle class="moon" cx="120" cy="70" r="64" fill="url(#moon)"/>
<circle cx="120" cy="70" r="22" fill="#eafff7" opacity=".85"/>
<text class="kj kanji" x="450" y="150" font-size="150" text-anchor="middle" fill="#9fe3c8">霞</text>
<ellipse class="m1" cx="300" cy="150" rx="340" ry="26" fill="#bfeede" opacity=".2" filter="url(#blur)"/>
<ellipse class="m2" cx="640" cy="170" rx="320" ry="24" fill="#9fe3c8" opacity=".17" filter="url(#blur)"/>
