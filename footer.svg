<text x="450" y="78" font-size="22" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#d7f3ea">THANKS FOR STOPPING BY.</text>
<text x="450" y="106" font-size="14" letter-spacing="1" text-anchor="middle" fill="#9fe3c8">The mist clears for those who keep building.</text>
<text x="450" y="132" font-size="12" letter-spacing="3" text-anchor="middle" fill="#8aa9a3"><tspan class="kanji">霞</tspan> · hashiratokito</text>
